# Smithery configuration for Detran PE: Guias de IPVA
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_detran_pe_guias_ipva

name: detran_pe_guias_ipva-mcp
displayName: "Detran PE: Guias de IPVA"
description: >
  Detran PE: Guias de IPVA, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/detran_pe_guias_ipva-mcp
repository: https://github.com/mcp-dir/detran_pe_guias_ipva-mcp

tags:
  - detran_pe_guias_ipva
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_detran_pe_guias_ipva

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_detran_pe_guias_ipva/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
